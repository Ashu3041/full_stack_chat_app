kind: Deployment
apiVersion: apps/v1

metadata:
  name: backend
  namespace: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ashu3041/backend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          value: "mongodb://mongo-svc:27017/chatapp"
---

kind: Service
apiVersion: v1
metadata:
  name: backend-svc
  namespace: nginx
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
