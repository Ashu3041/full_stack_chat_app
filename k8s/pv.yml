kind: PersistentVolume
apiVersion: v1

metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data
    type: DirectoryOrCreate
  claimRef:
    name: mongo-pvc
    namespace: nginx
  storageClassName: manual
