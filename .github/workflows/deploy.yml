name: Build and Deploy

on:
  push:
    tags:
      - 'v*'   # Triggers automatically whenever you push a tag like v2, v3, v4
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Manual Docker image tag (e.g., v2, v3)'
        required: true
        default: 'v2'
        type: string

env:
  # Uses your manual workflow_dispatch input if run from UI, otherwise uses the Git tag you pushed (e.g., v3)
  TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          IMAGE_TAG=${{ vars.DOCKERHUB_USERNAME }}/backend:${{ env.TAG }}
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG

      - name: Build and Push Frontend Image
        run: |
          IMAGE_TAG=${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ env.TAG }}
          docker build -t $IMAGE_TAG ./frontend
          docker push $IMAGE_TAG

      - name: Deploy Updated Images to Kubernetes
        run: |
          kubectl set image deployment/backend backend=${{ vars.DOCKERHUB_USERNAME }}/backend:${{ env.TAG }} -n nginx
          kubectl set image deployment/frontend frontend=${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ env.TAG }} -n nginx
          kubectl rollout status deployment/backend -n nginx --timeout=120s
          kubectl rollout status deployment/frontend -n nginx --timeout=120s
